id: AEHNLICH-MIT-MAIL
version: 1
status: entwurf
kategorie: E-Mail
schweregrad: mittel
cwe: CWE-451               # User Interface (UI) Misrepresentation of Critical Information
titel:
  de: Ähnliche Domain mit E-Mail-Empfang registriert
  en: Look-alike domain with mail exchanger registered
  es: Dominio parecido registrado con correo
geschaeftsleitung: >-
  Jemand besitzt eine Domain, die fast wie Ihre aussieht und E-Mails senden kann.
  Damit lassen sich gefälschte Rechnungen verschicken, die technisch «echt» wirken.
beschreibung: >-
  Für die Domain {domain} wurden registrierte Tippfehler-Varianten (z. B. vertauschte
  Buchstaben, verwechselbare Zeichen, andere Endung) mit MX-Eintrag gefunden. Die
  Inhaberschaft wurde nicht geprüft; es kann sich um legitime Drittfirmen handeln.
auswirkung: >-
  Gegen Absender aus einer fremden, ähnlich aussehenden Domain schützen SPF, DKIM und
  DMARC nicht – deren Prüfungen bestehen für die fremde Domain. Typisch sind Rechnungs-
  und CEO-Betrug mit geänderter Bankverbindung.
empfehlung: >-
  Inhaber der Varianten klären. Buchhaltung und Kunden sensibilisieren (Kontowechsel nie
  per E-Mail akzeptieren, Rückruf über bekannte Nummer). Wichtige Varianten selbst
  registrieren. Missbrauch dem Bundesamt für Cybersicherheit (BACS) melden.
pruefen: dig MX <variante> +short
referenzen:
  - BACS – Meldeformular für Cybervorfälle (https://www.ncsc.admin.ch)
